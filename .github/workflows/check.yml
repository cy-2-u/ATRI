name: check

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 类型检查（含 test/）+ 全部测试（含真进程 e2e 与假 LLM）+ 构建。
      - run: npm run check
