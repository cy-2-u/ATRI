name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 类型检查（含 test/）+ 格式检查 + 全部测试（含管理页/路由配对）+ 构建。
      - run: npm run check
      # 机制回归：假时钟跑 30 天，8 条分布断言（深夜静默/气泡方差/失败为零）
      # 防止改动悄悄破坏人味。
      - run: node --import tsx scripts/simulate-month.ts
