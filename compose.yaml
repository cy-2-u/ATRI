services:
  atri:
    build: .
    image: atri:local
    restart: unless-stopped
    # nsjail 需要在容器内建挂载树，Docker 默认安全配置不给这个权限，
    # 必须 privileged；模型能触达的范围仍被命名空间收窄（系统目录只读、
    # 默认无网络路由、看不到 /app 与 /data）。沙箱同时是她的手——
    # 心跳里她真实做成的事都发生在这个卷里。
    privileged: true
    env_file: .env
    environment:
      ATRI_DATA_DIR: /data
      ATRI_SANDBOX_DIR: /sandbox
      ATRI_BIND: 0.0.0.0
      ATRI_PORT: 3000
      # 她的窝（#7 常驻沙箱）：配置镜像即启用 docker 常驻容器执行——
      # 固定名 atri-sandbox、崩溃自拉起、可写层跨轮保留（她攒的环境
      # 不丢）、cap 全卸 + pids/内存/CPU 三限。WORKS 必须指宿主侧
      # 路径：嵌套 docker 的 bind 挂载发生在宿主。留空走 nsjail 兜底。
      ATRI_SANDBOX_IMAGE: ''
      ATRI_SANDBOX_WORKS: ''
    ports:
      - '${ATRI_BIND:-127.0.0.1}:${ATRI_PORT:-3000}:3000'
    volumes:
      - atri-data:/data
      # 她的工作目录必须在 /data 之外：nsjail 会把 /data 遮蔽成空 tmpfs。
      - atri-sandbox:/sandbox
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    stop_grace_period: 45s
volumes:
  atri-data:
  atri-sandbox:
