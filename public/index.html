<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>ATRI · 与她有关的一切</title>
    <link rel="icon" href="/atri.webp" type="image/webp" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main id="login" class="login">
      <img class="login-art" src="/atri.webp" alt="亚托莉" />
      <form id="login-form" class="login-card">
        <h1>ATRI</h1>
        <p class="login-sub">她醒着，等你回来。</p>
        <label class="field">
          <span>管理密码</span>
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="btn primary block" type="submit">进入</button>
      </form>
    </main>

    <div id="dashboard" class="app" hidden>
      <header class="topbar">
        <div class="brand">
          <img src="/atri.webp" alt="" />
          <span>ATRI</span>
        </div>
        <button
          id="connection"
          class="pill"
          type="button"
          data-drawer="drawer-connection"
          aria-haspopup="dialog"
          aria-controls="drawer-connection"
        >
          <span class="pill-dot" aria-hidden="true"></span>
          <span id="connection-text">管理空间</span>
        </button>
        <div class="topbar-actions">
          <button
            id="issues-bell"
            class="icon-btn"
            type="button"
            data-drawer="drawer-issues"
            aria-haspopup="dialog"
            aria-controls="drawer-issues"
            aria-label="待处理事项"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span id="issues-count" class="bell-badge" hidden></span>
          </button>
          <button id="logout" class="icon-btn" type="button" aria-label="退出登录">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <path d="m16 17 5-5-5-5" />
              <path d="M21 12H9" />
            </svg>
          </button>
        </div>
      </header>

      <div id="offline-banner" class="offline-banner" hidden>
        连接中断，正在重试——她还在，别担心。
      </div>

      <nav id="nav" class="nav" role="tablist" aria-label="功能导航">
        <button
          class="nav-item selected"
          id="tab-chat"
          role="tab"
          data-tab="chat"
          aria-selected="true"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"
            />
          </svg>
          <span>对话</span>
        </button>
        <button
          class="nav-item"
          id="tab-journal"
          role="tab"
          data-tab="journal"
          aria-selected="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          </svg>
          <span>内心</span>
        </button>
        <button
          class="nav-item"
          id="tab-persona"
          role="tab"
          data-tab="persona"
          aria-selected="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span>人设</span>
        </button>
        <button
          class="nav-item"
          id="tab-stickers"
          role="tab"
          data-tab="stickers"
          aria-selected="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="M8 14s1.5 2 4 2 4-2 4-2" />
            <path d="M9 9h.01M15 9h.01" />
          </svg>
          <span>表情</span>
        </button>
        <button class="nav-item" id="tab-system" role="tab" data-tab="system" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
          <span>系统</span>
        </button>
      </nav>

      <div id="views" class="main">
        <!-- 对话 -->
        <section
          id="view-chat"
          class="view chat-view"
          data-panel="chat"
          role="tabpanel"
          aria-labelledby="tab-chat"
          hidden
        >
          <div class="chat-main">
            <div id="chat-head" class="chat-head">
              <span id="chat-head-name" class="chat-head-name">她</span>
            </div>
            <div id="chat-messages" class="messages" aria-live="polite"></div>
          </div>
          <aside id="chat-side" class="chat-side">
            <p class="side-title">她此刻</p>
            <div id="self-chips" class="stack"></div>
          </aside>
        </section>

        <!-- 内心 -->
        <section
          id="view-journal"
          class="view"
          data-panel="journal"
          role="tabpanel"
          aria-labelledby="tab-journal"
          hidden
        >
          <div class="subtabs" role="tablist" aria-label="内心分区">
            <button class="subtab selected" data-journal="diary" role="tab" aria-selected="true">
              日记
            </button>
            <button class="subtab" data-journal="memories" role="tab" aria-selected="false">
              记忆
            </button>
            <button class="subtab" data-journal="thoughts" role="tab" aria-selected="false">
              念头
            </button>
            <button class="subtab" data-journal="commitments" role="tab" aria-selected="false">
              约定
            </button>
            <button class="subtab" data-journal="impressions" role="tab" aria-selected="false">
              印象
            </button>
            <button class="subtab" data-journal="works" role="tab" aria-selected="false">
              作品
            </button>
          </div>
          <div id="journal-list" class="journal-list"></div>
        </section>

        <!-- 人设 -->
        <section
          id="view-persona"
          class="view"
          data-panel="persona"
          role="tabpanel"
          aria-labelledby="tab-persona"
          hidden
        >
          <div class="settings-columns">
            <div class="settings-col persona-col">
              <div class="card persona-card">
                <h2>她是谁</h2>
                <label class="field">
                  <span>人格（她读到的自我描述）</span>
                  <textarea id="persona-text" rows="16"></textarea>
                </label>
                <p class="hint">修改会重建模型缓存。</p>
              </div>
            </div>
            <div class="settings-col">
              <div class="card">
                <h2>生理与节律</h2>
                <label class="field field-check">
                  <input id="heartbeat" type="checkbox" class="check" />
                  <span>心跳（她的意识节拍）</span>
                </label>
                <label class="field">
                  <span>心跳基准（分钟）</span>
                  <input id="beat-minutes" type="number" min="15" max="720" step="5" />
                  <span class="hint">黏人度越高拍越短</span>
                </label>
                <div class="grid-2">
                  <label class="field">
                    <span>入睡</span>
                    <input id="sleep-start" type="text" inputmode="numeric" placeholder="01:00" />
                    <span class="hint">HH:MM</span>
                  </label>
                  <label class="field">
                    <span>醒来</span>
                    <input id="sleep-end" type="text" inputmode="numeric" placeholder="08:00" />
                    <span class="hint">HH:MM</span>
                  </label>
                </div>
                <div class="grid-2">
                  <label class="field">
                    <span>日记钟点</span>
                    <input id="diary-hour" type="number" min="0" max="23" />
                  </label>
                  <label class="field">
                    <span>时区</span>
                    <input id="timezone" type="text" />
                  </label>
                </div>
                <div class="grid-2">
                  <label class="field">
                    <span>整轮思考超时（毫秒）</span>
                    <input id="turn-timeout" type="number" min="5000" max="600000" step="1000" />
                  </label>
                  <label class="field">
                    <span>连发合并（毫秒）</span>
                    <input id="debounce" type="number" min="0" max="10000" step="100" />
                  </label>
                </div>
                <button id="save-persona" class="btn primary">保存人设与节律</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 表情 -->
        <section
          id="view-stickers"
          class="view"
          data-panel="stickers"
          role="tabpanel"
          aria-labelledby="tab-stickers"
          hidden
        >
          <div class="card">
            <h2>她的表情</h2>
            <p class="hint">她按含义挑表情。</p>
            <div id="sticker-grid" class="sticker-grid"></div>
          </div>
          <div class="card">
            <h2>添加自定义表情</h2>
            <div class="grid-2">
              <label class="field"
                ><span>slug（小写字母/数字/连字符）</span><input id="sticker-slug" type="text"
              /></label>
              <label class="field"
                ><span>含义（她看目录时读的文字）</span><input id="sticker-desc" type="text"
              /></label>
            </div>
            <label class="field"
              ><span>图片（PNG/JPEG/GIF/WebP，≤20 MB）</span
              ><input id="sticker-file" type="file" accept="image/*"
            /></label>
            <button id="add-sticker" class="btn primary">上传</button>
          </div>
        </section>

        <!-- 系统 -->
        <section
          id="view-system"
          class="view"
          data-panel="settings"
          role="tabpanel"
          aria-labelledby="tab-system"
          hidden
        >
          <div class="settings-columns">
            <div class="settings-col">
              <div class="card">
                <h2>主模型渠道</h2>
                <div class="grid-2">
                  <label class="field"
                    ><span>协议</span>
                    <div class="dropdown-host" id="primary-format"></div>
                  </label>
                  <div class="field-with-action">
                    <label class="field"
                      ><span>模型</span><input id="primary-model" type="text"
                    /></label>
                    <button class="btn ghost" id="fetch-models" type="button">拉取模型</button>
                  </div>
                </div>
                <label class="field"><span>地址</span><input id="primary-url" type="text" /></label>
                <label class="field">
                  <span>密钥<span id="primary-key-state" class="hint"></span></span>
                  <input id="primary-key" type="password" autocomplete="new-password" />
                </label>
                <label class="field field-check"
                  ><input id="primary-vision" type="checkbox" class="check" /><span
                    >视觉（她能看图）</span
                  ></label
                >
                <div class="grid-4">
                  <label class="field"
                    ><span>温度<span class="hint">（默认 1）</span></span
                    ><input id="primary-temp" type="number" min="0" max="2" step="0.1"
                  /></label>
                  <label class="field"
                    ><span>超时 ms</span
                    ><input id="primary-timeout" type="number" min="1000" max="180000" step="1000"
                  /></label>
                  <label class="field"
                    ><span>输出上限</span
                    ><input id="primary-output" type="number" min="256" max="131072" step="256"
                  /></label>
                  <label class="field"
                    ><span>上下文容量</span
                    ><input id="primary-context" type="number" min="4096" max="2000000" step="1024"
                  /></label>
                </div>
                <div class="actions">
                  <button class="btn ghost" id="test-llm" type="button">测试渠道</button>
                </div>
              </div>
              <div class="card">
                <h2>备用渠道</h2>
                <label class="field field-check"
                  ><input id="fallback-on" type="checkbox" class="check" /><span
                    >启用备用渠道（勾选后展开配置）</span
                  ></label
                >
                <div id="fallback-fields">
                  <div class="grid-2">
                    <label class="field"
                      ><span>协议</span>
                      <div class="dropdown-host" id="fallback-format"></div>
                    </label>
                    <div class="field-with-action">
                      <label class="field"
                        ><span>模型</span><input id="fallback-model" type="text"
                      /></label>
                      <button class="btn ghost" id="fetch-models-fallback" type="button">拉取模型</button>
                    </div>
                  </div>
                  <label class="field"
                    ><span>地址</span><input id="fallback-url" type="text"
                  /></label>
                  <label class="field">
                    <span>密钥<span id="fallback-key-state" class="hint"></span></span>
                    <input id="fallback-key" type="password" autocomplete="new-password" />
                  </label>
                  <label class="field field-check"
                    ><input id="fallback-vision" type="checkbox" class="check" /><span
                      >视觉（她能看图）</span
                    ></label
                  >
                  <div class="grid-4">
                    <label class="field"
                      ><span>温度<span class="hint">（默认 1）</span></span
                      ><input id="fallback-temp" type="number" min="0" max="2" step="0.1"
                    /></label>
                    <label class="field"
                      ><span>超时 ms</span
                      ><input id="fallback-timeout" type="number" min="1000" max="180000" step="1000"
                    /></label>
                    <label class="field"
                      ><span>输出上限</span
                      ><input id="fallback-output" type="number" min="256" max="131072" step="256"
                    /></label>
                    <label class="field"
                      ><span>上下文容量</span
                      ><input id="fallback-context" type="number" min="4096" max="2000000" step="1024"
                    /></label>
                  </div>
                  <div class="actions">
                    <button class="btn ghost" id="test-fallback" type="button">测试渠道</button>
                  </div>
                </div>
              </div>
              <div class="card">
                <h2>她的眼：联网与向量</h2>
                <label class="field field-check"
                  ><input id="web-on" type="checkbox" class="check" /><span
                    >启用联网搜索</span
                  ></label
                >
                <label class="field">
                  <span>Tavily 搜索密钥<span id="web-key-state" class="hint"></span></span>
                  <input id="web-key" type="password" autocomplete="new-password" />
                </label>
                <div class="grid-2">
                  <label class="field"
                    ><span>向量模型</span><input id="embedding-model" type="text"
                  /></label>
                  <label class="field"
                    ><span>向量地址（留空复用主渠道）</span><input id="embedding-url" type="text"
                  /></label>
                </div>
                <label class="field">
                  <span>向量密钥<span id="embedding-key-state" class="hint"></span></span>
                  <input id="embedding-key" type="password" autocomplete="new-password" />
                </label>
                <p class="hint">填了向量模型才启用语义召回。</p>
              </div>
              <div class="card">
                <h2>她的画笔：图片生成</h2>
                <label class="field field-check"
                  ><input id="image-on" type="checkbox" class="check" /><span
                    >启用画笔（关着她就收不到画图工具）</span
                  ></label
                >
                <div class="grid-2">
                  <label class="field"
                    ><span>画图引擎</span
                    ><select id="image-engine" class="select">
                      <option value="gpt">GPT（通用 OpenAI 生图）</option>
                      <option value="nai">NAI（NovelAI 4.5）</option>
                    </select></label
                  >
                </div>
                <div id="image-gpt-fields">
                  <div class="grid-2">
                    <label class="field"
                      ><span>GPT 画图模型</span><input id="image-gpt-model" type="text"
                    /></label>
                    <label class="field"
                      ><span>GPT 地址（留空复用主渠道）</span><input id="image-gpt-url" type="text"
                    /></label>
                  </div>
                  <label class="field">
                    <span>GPT 密钥<span id="image-gpt-key-state" class="hint"></span></span>
                    <input id="image-gpt-key" type="password" autocomplete="new-password" />
                  </label>
                </div>
                <div id="image-nai-fields">
                  <div class="grid-2">
                    <label class="field"
                      ><span>NAI 模型（默认 4.5-full）</span><input id="image-nai-model" type="text"
                    /></label>
                    <label class="field"
                      ><span>NAI 步数（免费上限 28）</span
                      ><input id="image-nai-steps" type="number" min="1" max="28" value="28"
                    /></label>
                  </div>
                  <label class="field"
                    ><span>NAI 地址</span><input id="image-nai-url" type="text"
                  /></label>
                  <label class="field">
                    <span>NAI 密钥<span id="image-nai-key-state" class="hint"></span></span>
                    <input id="image-nai-key" type="password" autocomplete="new-password" />
                  </label>
                  <p class="hint">NAI 用英文 danbooru tag 串作画，免费档自动收口（单张/28 步/纯文生图）。</p>
                </div>
              </div>
              <div class="card">
                <h2>每日备份</h2>
                <label class="field field-check"
                  ><input id="backup-on" type="checkbox" class="check" /><span
                    >备份到 WebDAV（按间隔自动）</span
                  ></label
                >
                <div id="backup-fields">
                  <div class="grid-2">
                    <label class="field"
                      ><span>地址</span
                      ><input
                        id="backup-url"
                        type="text"
                        placeholder="https://dav.jianguoyun.com/dav/"
                    /></label>
                    <label class="field"
                      ><span>账号</span><input id="backup-user" type="text" autocomplete="off"
                    /></label>
                  </div>
                  <label class="field">
                    <span>密码<span id="backup-password-state" class="hint"></span></span>
                    <input id="backup-password" type="password" autocomplete="new-password" />
                  </label>
                  <label class="field"
                    ><span>间隔（小时）</span
                    ><input id="backup-hours" type="number" min="1" max="720" step="1"
                  /></label>
                  <p class="hint">恢复用 npm run restore（只写新目录）。</p>
                  <div class="actions">
                    <button class="btn ghost" id="backup-now" type="button">立即备份</button>
                    <p id="backup-state" class="hint"></p>
                  </div>
                </div>
              </div>
            </div>
            <div class="settings-col">
              <div class="card">
                <h2>她的手：隔离执行</h2>
                <div class="grid-2">
                  <label class="field field-check"
                    ><input id="execution-on" type="checkbox" class="check" /><span
                      >启用沙箱执行</span
                    ></label
                  >
                  <label class="field field-check"
                    ><input id="execution-net" type="checkbox" class="check" /><span
                      >沙箱联网</span
                    ></label
                  >
                </div>
                <p class="hint">她的窝：作品目录真实挂载，环境跨轮保留；密钥与数据库不可见。</p>
              </div>
              <div class="card">
                <h2>用量（近 7 天）</h2>
                <div id="usage-grid" class="usage-grid"></div>
              </div>
              <button id="save-system" class="btn primary block">保存系统配置</button>
            </div>
          </div>
        </section>
      </div>

      <!-- QQ 连接：非阻塞侧板——点外面收起，不罩全页遮罩 -->
      <div id="drawer-connection" class="drawer" hidden>
        <div class="drawer-body" role="dialog" aria-modal="false" aria-label="QQ 连接">
          <div class="drawer-head">
            <h2>QQ 连接</h2>
            <button class="icon-btn" type="button" data-close aria-label="关闭">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
            </button>
          </div>
          <div class="drawer-body-inner stack-tight">
            <div id="qq-status" class="row"></div>
            <div class="grid-2">
              <label class="field"
                ><span>AppID</span><input id="qq-appid" type="text" autocomplete="off"
              /></label>
              <label class="field"
                ><span>AppSecret<span id="qq-secret-state" class="hint"></span></span
                ><input id="qq-secret" type="password" autocomplete="new-password"
              /></label>
            </div>
            <label class="field field-check"
              ><input id="qq-enabled" type="checkbox" class="check" /><span
                >启用 QQ（连接官方网关）</span
              ></label
            >
            <div class="actions">
              <button id="save-qq" class="btn primary" type="button">保存并启用</button>
              <button id="qq-probe" class="btn ghost" type="button">检查凭证</button>
            </div>
            <div id="contact-list" class="peer-list"></div>
          </div>
        </div>
      </div>

      <!-- 待办 -->
      <div id="drawer-issues" class="drawer" hidden>
        <div class="drawer-body" role="dialog" aria-modal="false" aria-label="待处理事项">
          <div class="drawer-head">
            <h2>待处理事项</h2>
            <button class="icon-btn" type="button" data-close aria-label="关闭">
