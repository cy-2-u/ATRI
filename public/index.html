<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>ATRI · 与她有关的一切</title>
    <link rel="icon" href="/atri.webp" type="image/webp" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main id="login" class="login">
      <img class="login-art" src="/atri.webp" alt="亚托莉" />
      <form id="login-form" class="login-card">
        <h1>ATRI</h1>
        <p class="login-sub">她醒着，等你回来。</p>
        <label class="field">
          <span>管理密码</span>
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="btn primary block" type="submit">进入</button>
      </form>
    </main>

    <div id="dashboard" class="app" hidden>
      <header class="topbar">
        <div class="brand">
          <img src="/atri.webp" alt="" />
          <span>ATRI</span>
        </div>
        <button
          id="connection"
          class="pill"
          type="button"
          data-drawer="drawer-connection"
          aria-haspopup="dialog"
          aria-controls="drawer-connection"
        >
          <span class="pill-dot" aria-hidden="true"></span>
          <span id="connection-text">管理空间</span>
        </button>
        <div class="topbar-actions">
          <button
            id="issues-bell"
            class="icon-btn"
            type="button"
            data-drawer="drawer-issues"
            aria-haspopup="dialog"
            aria-controls="drawer-issues"
            aria-label="待处理事项"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span id="issues-count" class="bell-badge" hidden></span>
          </button>
          <button id="logout" class="icon-btn" type="button" aria-label="退出登录">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <path d="m16 17 5-5-5-5" />
              <path d="M21 12H9" />
            </svg>
          </button>
        </div>
      </header>

      <nav id="nav" class="nav" role="tablist" aria-label="功能导航">
        <button class="nav-item selected" id="tab-chat" role="tab" data-tab="chat" aria-selected="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z" />
          </svg>
          <span>对话</span>
        </button>
        <button class="nav-item" id="tab-journal" role="tab" data-tab="journal" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          </svg>
          <span>内心</span>
        </button>
        <button class="nav-item" id="tab-persona" role="tab" data-tab="persona" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span>人设</span>
        </button>
        <button class="nav-item" id="tab-stickers" role="tab" data-tab="stickers" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="M8 14s1.5 2 4 2 4-2 4-2" />
            <path d="M9 9h.01M15 9h.01" />
          </svg>
          <span>表情</span>
        </button>
        <button class="nav-item" id="tab-system" role="tab" data-tab="system" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
          <span>系统</span>
        </button>
      </nav>

      <div id="views" class="main">
        <!-- 对话 -->
        <section id="view-chat" class="view chat-view" role="tabpanel" aria-labelledby="tab-chat" hidden>
          <div class="chat-main">
            <div id="chat-head" class="chat-head">
              <span id="chat-head-name" class="chat-head-name">她</span>
              <span id="chat-hint" class="chat-hint"></span>
            </div>
            <div id="chat-messages" class="messages" aria-live="polite"></div>
          </div>
          <aside id="chat-side" class="chat-side">
            <p class="side-title">她此刻</p>
            <div id="self-chips" class="stack"></div>
          </aside>
        </section>

        <!-- 内心 -->
        <section id="view-journal" class="view" role="tabpanel" aria-labelledby="tab-journal" hidden>
          <div class="subtabs" role="tablist" aria-label="内心分区">
            <button class="subtab selected" data-journal="diary" role="tab" aria-selected="true">日记</button>
            <button class="subtab" data-journal="memories" role="tab" aria-selected="false">记忆</button>
            <button class="subtab" data-journal="thoughts" role="tab" aria-selected="false">念头</button>
            <button class="subtab" data-journal="commitments" role="tab" aria-selected="false">约定</button>
          </div>
          <div id="journal-list" class="journal-list"></div>
        </section>

        <!-- 人设 -->
        <section id="view-persona" class="view" role="tabpanel" aria-labelledby="tab-persona" hidden>
          <div class="settings-columns">
            <div class="settings-col">
              <div class="card">
                <h2>她是谁</h2>
                <label class="field">
                  <span>人格（她读到的自我描述）</span>
                  <textarea id="persona-text" rows="16"></textarea>
                </label>
                <p class="hint">人格在稳定前缀里：修改会重建模型缓存，属正常现象。</p>
              </div>
            </div>
            <div class="settings-col">
              <div class="card">
                <h2>生理与节律</h2>
                <label class="field field-with-action">
                  <span>心跳（她的意识节拍）</span>
                  <input id="heartbeat" type="checkbox" class="check" />
                </label>
                <label class="field">
                  <span>黏人度（0–100：90→18 分钟一拍，0→90 分钟）</span>
                  <input id="closeness" type="number" min="0" max="100" step="1" />
                </label>
                <div class="grid-2">
                  <label class="field">
                    <span>入睡（分钟 0–1439，60=1:00）</span>
                    <input id="sleep-start" type="number" min="0" max="1439" />
                  </label>
                  <label class="field">
                    <span>醒来（分钟，420=7:00）</span>
                    <input id="sleep-end" type="number" min="0" max="1439" />
                  </label>
                </div>
                <div class="grid-2">
                  <label class="field">
                    <span>日记时刻（点）</span>
                    <input id="diary-hour" type="number" min="0" max="23" />
                  </label>
                  <label class="field">
                    <span>时区</span>
                    <input id="timezone" type="text" />
                  </label>
                </div>
                <div class="grid-2">
                  <label class="field">
                    <span>整轮思考超时（毫秒）</span>
                    <input id="turn-timeout" type="number" min="5000" max="600000" step="1000" />
                  </label>
                  <label class="field">
                    <span>连发合并（毫秒）</span>
                    <input id="debounce" type="number" min="0" max="10000" step="100" />
                  </label>
                </div>
                <button id="save-persona" class="btn primary">保存人设与节律</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 表情 -->
        <section id="view-stickers" class="view" role="tabpanel" aria-labelledby="tab-stickers" hidden>
          <div class="card">
            <h2>她的表情</h2>
            <p class="hint">最多启用 32 个；停用的不再进提示词目录。</p>
            <div id="sticker-grid" class="sticker-grid"></div>
          </div>
          <div class="card">
            <h2>添加自定义表情</h2>
            <div class="grid-2">
              <label class="field"><span>slug（小写字母/数字/连字符）</span><input id="sticker-slug" type="text" /></label>
              <label class="field"><span>含义（她看目录时读的文字）</span><input id="sticker-desc" type="text" /></label>
            </div>
            <label class="field"><span>标签（逗号分隔，可选）</span><input id="sticker-tags" type="text" /></label>
            <label class="field"><span>图片（PNG/JPEG/GIF/WebP，≤3 MB）</span><input id="sticker-file" type="file" accept="image/*" /></label>
            <button id="add-sticker" class="btn primary">上传</button>
          </div>
        </section>

        <!-- 系统 -->
        <section id="view-system" class="view" role="tabpanel" aria-labelledby="tab-system" hidden>
          <div class="settings-columns">
            <div class="settings-col">
              <div class="card">
                <h2>主模型渠道</h2>
                <div class="grid-2">
                  <label class="field"><span>协议</span>
                    <select id="primary-format">
                      <option value="openai">OpenAI 兼容</option>
                      <option value="anthropic">Anthropic</option>
                      <option value="gemini">Gemini</option>
                    </select>
                  </label>
                  <label class="field"><span>模型</span><input id="primary-model" type="text" /></label>
                </div>
                <label class="field"><span>地址</span><input id="primary-url" type="text" /></label>
                <label class="field field-with-action">
                  <span>密钥<span id="primary-key-state" class="hint"></span></span>
                  <input id="primary-key" type="password" autocomplete="new-password" />
                </label>
                <label class="field field-with-action">
                  <span>清除已存密钥</span>
                  <input id="primary-clear" type="checkbox" class="check" />
                </label>
                <div class="grid-2">
                  <label class="field"><span>视觉（她能看图）</span><input id="primary-vision" type="checkbox" class="check" /></label>
                  <label class="field"><span>温度（可留空）</span><input id="primary-temp" type="number" min="0" max="2" step="0.1" /></label>
                </div>
                <div class="grid-3">
                  <label class="field"><span>超时 ms</span><input id="primary-timeout" type="number" min="1000" max="180000" step="1000" /></label>
                  <label class="field"><span>输出上限</span><input id="primary-max-tokens" type="number" min="128" max="32768" step="128" /></label>
                  <label class="field"><span>重试</span><input id="primary-retries" type="number" min="0" max="4" /></label>
                </div>
              </div>
              <div class="card">
                <h2>备用渠道（主渠道连续 3 轮失败冷却 1 小时后接管）</h2>
                <label class="field field-with-action"><span>启用备用渠道</span><input id="fallback-on" type="checkbox" class="check" /></label>
                <div id="fallback-fields">
                  <div class="grid-2">
                    <label class="field"><span>协议</span>
                      <select id="fallback-format">
                        <option value="openai">OpenAI 兼容</option>
                        <option value="anthropic">Anthropic</option>
                        <option value="gemini">Gemini</option>
                      </select>
                    </label>
                    <label class="field"><span>模型</span><input id="fallback-model" type="text" /></label>
                  </div>
                  <label class="field"><span>地址</span><input id="fallback-url" type="text" /></label>
                  <label class="field field-with-action">
                    <span>密钥<span id="fallback-key-state" class="hint"></span></span>
                    <input id="fallback-key" type="password" autocomplete="new-password" />
                  </label>
                  <label class="field field-with-action"><span>清除已存密钥</span><input id="fallback-clear" type="checkbox" class="check" /></label>
                </div>
              </div>
              <div class="card">
                <h2>她的眼：联网与向量</h2>
                <label class="field field-with-action">
                  <span>Tavily 搜索密钥<span id="web-key-state" class="hint"></span></span>
                  <input id="web-key" type="password" autocomplete="new-password" />
                </label>
                <div class="grid-2">
                  <label class="field"><span>向量模型（留空关闭语义召回）</span><input id="embedding-model" type="text" /></label>
                  <label class="field"><span>向量地址（留空复用主渠道）</span><input id="embedding-url" type="text" /></label>
                </div>
                <label class="field field-with-action">
                  <span>向量密钥<span id="embedding-key-state" class="hint"></span></span>
                  <input id="embedding-key" type="password" autocomplete="new-password" />
                </label>
                <label class="field field-with-action"><span>停用向量检索</span><input id="embedding-clear" type="checkbox" class="check" /></label>
                <p id="embeddings-state" class="hint"></p>
              </div>
            </div>
            <div class="settings-col">
              <div class="card">
                <h2>她的手：沙箱</h2>
                <div class="grid-2">
                  <label class="field field-with-action"><span>启用沙箱</span><input id="sandbox-on" type="checkbox" class="check" /></label>
                  <label class="field field-with-action"><span>沙箱联网</span><input id="sandbox-net" type="checkbox" class="check" /></label>
                </div>
                <div class="grid-2">
                  <label class="field"><span>容量上限 MB</span><input id="sandbox-size" type="number" min="0" max="65536" /></label>
                  <label class="field"><span>内存上限 MB</span><input id="sandbox-memory" type="number" min="0" max="65536" /></label>
                </div>
                <p id="sandbox-state" class="hint"></p>
                <div id="sandbox-files" class="recent-list"></div>
              </div>
              <div class="card">
                <h2>用量（近 7 天）</h2>
                <div id="usage-grid" class="usage-grid"></div>
              </div>
              <button id="save-system" class="btn primary block">保存系统配置</button>
            </div>
          </div>
        </section>
      </div>

      <!-- 微信连接 -->
      <div id="drawer-connection" class="drawer" hidden>
        <div class="drawer-backdrop" data-close></div>
        <div class="drawer-body" role="dialog" aria-modal="true" aria-label="微信连接">
          <div class="drawer-head">
            <h2>微信连接</h2>
            <button class="icon-btn" type="button" data-close aria-label="关闭">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
            </button>
          </div>
          <div class="drawer-body-inner stack">
            <div id="wechat-status" class="row"></div>
            <div id="wechat-qr" class="qr"></div>
            <div class="actions">
              <button id="wechat-login" class="btn primary">扫码登录</button>
              <button id="wechat-logout" class="btn ghost danger">退出微信</button>
            </div>
            <div id="contact-list" class="peer-list"></div>
          </div>
        </div>
      </div>

      <!-- 待办 -->
      <div id="drawer-issues" class="drawer" hidden>
        <div class="drawer-backdrop" data-close></div>
        <div class="drawer-body" role="dialog" aria-modal="true" aria-label="待处理事项">
          <div class="drawer-head">
            <h2>待处理事项</h2>
            <button class="icon-btn" type="button" data-close aria-label="关闭">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
            </button>
          </div>
          <div id="issues-list" class="drawer-body-inner stack"></div>
        </div>
      </div>

      <div id="notice" class="toast" hidden></div>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
